name: CI — Go (Financial Pod)

on:
  push:
    branches: [main, dev]
    paths:
      - 'agent-pod/financial-pod/**'
      - 'agent-pod/daemon/**'
      - 'agent-pod/proto/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'agent-pod/financial-pod/**'
      - 'agent-pod/daemon/**'
      - 'agent-pod/proto/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Financial Pod
        working-directory: agent-pod/financial-pod
        run: go build ./...

      - name: Run Financial Pod Tests
        working-directory: agent-pod/financial-pod
        run: go test ./... -v -short

      - name: Build Discovery Daemon
        working-directory: agent-pod/daemon
        run: go build ./...
