name: CI — Python (SDK & API)

on:
  push:
    branches: [main, dev]
    paths:
      - 'api/**'
      - 'sdk/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'api/**'
      - 'sdk/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter
        run: |
          pip install flake8
          flake8 api/ sdk/ --max-line-length=120 --ignore=E501,W503 --exclude=*_pb2*.py

      - name: Run tests
        run: pytest tests/ -v --tb=short
