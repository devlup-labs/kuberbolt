[project]
name = "kuberbolt"
version = "0.1.0"
description = "Autonomous Agent Discovery & Payment Network (Nostr + L402 + Lightning)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["lightning", "nostr", "l402", "agents", "bitcoin"]
dependencies = [
    "fastapi>=0.110",
    "nostr-sdk>=0.45",
    "pydantic>=2",
    "starlette>=0.36",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["sdk*", "api*", "client*"]
