[project]
name = "kuberbolt-sdk"
version = "0.1.0"
description = "Kuberbolt Python SDK — Nostr identity, discovery, and endpoint negotiation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["nostr", "lightning", "l402", "agents"]
dependencies = [
    "nostr-sdk>=0.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"
